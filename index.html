<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>100 Reasons I Love You</title>
  <style>
    @font-face{font-family:"Rubik Local";src:url("assets/Rubik-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:block}
    @font-face{font-family:"Birthday Bookman";src:url("assets/URWBookman-Demi.otf") format("opentype");font-weight:700;font-style:normal;font-display:block}
    :root{--pink:#f47fa8;--dark:#8d3d60;--paper:#fffdf9;--bg:#ffdfea}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:"Rubik Local",sans-serif;color:var(--dark);background:linear-gradient(145deg,#ffd9e8,#fff0f5 52%,#f8cfe0);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 2px,transparent 2px),radial-gradient(#f4a6c1 1.5px,transparent 1.5px);background-position:0 0,22px 22px;background-size:44px 44px;opacity:.6}
    .heart{position:fixed;color:#fff8;font-size:22px;animation:float 8s linear infinite;pointer-events:none}.heart:nth-child(2){left:11%;animation-delay:-2s}.heart:nth-child(3){left:81%;animation-delay:-5s}.heart:nth-child(4){left:55%;animation-delay:-7s}
    main{position:relative;z-index:1;width:min(1120px,94vw);margin:auto;padding:66px 0 80px;text-align:center}
    h1{font-family:"Birthday Bookman","Rubik Local",sans-serif;font-weight:700;font-size:clamp(38px,5.8vw,66px);line-height:1.18;margin:0;color:#a83f6a;text-shadow:0 3px #fff;letter-spacing:-1.5px}
    .subtitle{font-size:clamp(16px,2vw,20px);margin:14px auto 47px;color:#a75b79}.arrow{display:inline-block;animation:bob 1.2s infinite}
    .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:34px 24px;align-items:start}.card{grid-column:span 2;border:0;background:transparent;padding:0;cursor:pointer;transition:.25s;color:var(--dark)}.card:nth-child(4){grid-column:2/span 2}.card:nth-child(5){grid-column:4/span 2}.card:hover{transform:translateY(-7px) scale(1.025);z-index:2}
    .photo{aspect-ratio:1;border:6px solid #fff;border-radius:22px;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--photo);isolation:isolate;box-shadow:0 14px 30px #9b476536}.photo:before,.photo:after{content:"";position:absolute;border-radius:50%;z-index:-1}.photo:before{width:150px;height:150px;background:#fff5;left:-40px;top:-30px}.photo:after{width:130px;height:130px;background:#ffffff45;right:-45px;bottom:-30px}.photo span{padding:10px 14px;background:#ffffffc9;border-radius:999px;font-size:13px;color:#9e5471;box-shadow:0 4px 15px #87486122}
    .card h2{font-size:18px;line-height:1.25;margin:13px 4px 0}.one{--photo:linear-gradient(145deg,#f8b8ce,#ffe6ef)}.two{--photo:linear-gradient(145deg,#d9c7ff,#f1eaff)}.three{--photo:linear-gradient(145deg,#ffe59e,#fff3cc)}.four{--photo:linear-gradient(145deg,#bfeadf,#e9fbf7)}.five{--photo:linear-gradient(145deg,#ffc4bb,#ffe8e3)}
    .modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#78384f70;backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.3s}.modal.open{opacity:1;pointer-events:auto}.book{position:relative;width:min(680px,95vw);max-height:88vh;overflow:auto;background:#fffdf9;border-radius:25px;padding:42px clamp(22px,6vw,55px);box-shadow:0 25px 80px #58283b70;transform:translateY(20px) scale(.95);transition:.4s}.open .book{transform:none}.close{position:absolute;right:20px;top:17px;width:38px;height:38px;border:0;border-radius:50%;background:#ffd9e7;color:#9b4164;font-size:24px;cursor:pointer}.book h2{font-weight:700;font-size:clamp(28px,5vw,42px);margin:0 40px 24px;color:#a83f6a}.reasons{display:grid;gap:10px;text-align:left}.reason{position:relative;background:#fff1f6;border-radius:15px;padding:14px 17px;font-size:16px}
    @keyframes float{from{top:110vh;transform:rotate(0)}to{top:-10vh;transform:rotate(50deg)}}@keyframes bob{50%{transform:translateY(6px)}}
    @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr);gap:24px 16px}.card,.card:nth-child(4),.card:nth-child(5){grid-column:auto}.card:last-child{grid-column:1/-1;width:calc(50% - 8px);justify-self:center}}@media(max-width:580px){main{padding-top:42px}.card h2{font-size:15px}.subtitle{margin-bottom:30px}.photo{border-width:4px;border-radius:17px}}
  </style>
</head>
<body>
  <i class="heart" style="left:4%;animation-delay:-1s">♡</i><i class="heart" style="left:15%;animation-delay:-6s">♡</i><i class="heart" style="left:28%;animation-delay:-3s">♡</i><i class="heart" style="left:41%;animation-delay:-7s">♡</i><i class="heart" style="left:55%;animation-delay:-4s">♡</i><i class="heart" style="left:68%;animation-delay:-8s">♡</i><i class="heart" style="left:81%;animation-delay:-2s">♡</i><i class="heart" style="left:94%;animation-delay:-5s">♡</i>
  <main>
    <h1>happy 20th birthday kai &lt;3</h1>
    <p class="subtitle">100 reasons why i love you :3</p>
    <section class="cards" aria-label="Five chapters of reasons">
      <button class="card one" data-title="20 things i love about you :3"><div class="photo"><span>your picture here ♡</span></div><h2>20 things i love about you :3</h2></button>
      <button class="card two" data-title="20 things that remind me of you :3"><div class="photo"><span>your picture here ♡</span></div><h2>20 things that remind me of you :3</h2></button>
      <button class="card three" data-title="20 memories of us that i love :3"><div class="photo"><span>your picture here ♡</span></div><h2>20 memories of us that i love :3</h2></button>
      <button class="card four" data-title="20 ways you make me feel :3"><div class="photo"><span>your picture here ♡</span></div><h2>20 ways you make me feel :3</h2></button>
      <button class="card five" data-title="20 things i wanna do with you :3"><div class="photo"><span>your picture here ♡</span></div><h2>20 things i wanna do with you :3</h2></button>
    </section>
  </main>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="chapterTitle">
    <article class="book"><button class="close" aria-label="Close">×</button><h2 id="chapterTitle"></h2><div class="reasons" id="reasons"></div></article>
  </div>
  <script>
  const reasonLists = [
    // FIRST PICTURE: 20 things i love about you
    [
      "I love your smile.",
      "I love your voice.",
      "I love how you make me laugh.",
      "Type your fourth reason here.",
      "Type your fifth reason here."
    ],

    // SECOND PICTURE: 20 things that remind me of you
    [
      "This song always reminds me of you.",
      "Whenever I see ___, I think about you.",
      "The color ___ reminds me of you.",
      "Type another thing here.",
      "Type another thing here."
    ],

    // THIRD PICTURE: 20 memories of us that i love
    [
      "One of my favorite memories is when...",
      "I’ll never forget the time we...",
      "I still laugh when I remember...",
      "Type another memory here.",
      "Type another memory here."
    ],

    // FOURTH PICTURE: 20 ways you make me feel
    [
      "You make me feel loved.",
      "You make me feel understood.",
      "You make me feel less alone.",
      "Type another feeling here.",
      "Type another feeling here."
    ],

    // FIFTH PICTURE: 20 things i wanna do with you
    [
      "I want to celebrate more birthdays with you.",
      "I want to watch our favorite movies together.",
      "I want to travel somewhere new with you.",
      "Type another thing here.",
      "Type another thing here."
    ]
  ];

  const modal = document.querySelector("#modal");
  const title = document.querySelector("#chapterTitle");
  const list = document.querySelector("#reasons");
  const cards = document.querySelectorAll(".card");

  cards.forEach((card, categoryNumber) => {
    card.addEventListener("click", () => {
      title.textContent = card.dataset.title;
      list.replaceChildren();

      reasonLists[categoryNumber].forEach(reason => {
        const reasonBox = document.createElement("div");
        reasonBox.className = "reason";
        reasonBox.textContent = reason;
        list.appendChild(reasonBox);
      });

      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    });
  });

  function closeSection() {
    modal.classList.remove("open");
    document.body.style.overflow = "";
  }

  document.querySelector(".close").addEventListener("click", closeSection);

  modal.addEventListener("click", event => {
    if (event.target === modal) {
      closeSection();
    }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      closeSection();
    }
  });
</script>
</body>
</html>
